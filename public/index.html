<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch Party</title><link rel="stylesheet" href="style.css?v=6"></head><body>
<section id="lobby"><div class="card"><h1>🍿 Watch Party</h1><p class="mut">Watch together, perfectly in sync.</p>
<input id="name" placeholder="Your name" maxlength="24"><button id="create" class="pri">Create a room</button>
<div class="or">or join with a code</div><div class="row"><input id="code" placeholder="ROOM CODE" maxlength="5"><button id="join">Join</button></div><p id="lerr" class="err"></p></div></section>
<main id="app" hidden>
<header><b>🍿 Watch Party</b><span id="rc" class="pill"></span><button id="copy">Copy invite link</button><span id="sync" class="pill">connecting…</span><span id="conn" class="err"></span><div class="notification-wrap"><button id="notifButton" class="notif-btn" aria-label="Notifications">🔔<span id="notifBadge" class="notif-badge" hidden>0</span></button><div id="notifPanel" class="notif-panel" hidden><div class="notif-head"><b>Notifications</b><button id="clearNotif">Clear</button></div><div id="notifications"></div></div></div></header>
<div class="grid"><div class="left">
<div class="player"><video id="v" playsinline></video><div id="float"></div><div id="ptitle" class="mut"></div></div>
<div class="ctl"><button id="pp">▶</button><input type="range" id="seek" min="0" max="1000" value="0"><span id="tm">0:00</span><span id="emo"></span></div>
<div class="media-tools"><label class="file-pick">Upload video <input id="videoFile" type="file" accept="video/mp4,video/webm,video/ogg,video/quicktime"></label><button id="shareScreen">Share screen / tab</button><button id="stopShare" disabled>Stop shared media</button><button id="enableAudio">Join audio</button><span id="mediaStatus" class="mut">Everyone can join shared audio when the host shares media.</span></div>
<section><h3>Discover</h3><div class="row"><input id="q" placeholder="Search movies (typos are OK)…"><select id="sort"><option value="">Top rated</option><option value="year">Newest</option><option value="title">A–Z</option></select><select id="minr"><option value="0">Any rating</option><option value="6.5">6.5+</option><option value="7">7+</option></select></div><div id="cats" class="chips"></div><div id="movies" class="cards"></div></section></div>
<aside><nav class="tabs"><button data-t="chat" class="on">Chat</button><button data-t="queue">Queue</button><button data-t="polls">Polls</button><button data-t="people">People</button></nav><div id="t-chat" class="tab"><div id="chatlog"></div><div class="row"><input id="ci" placeholder="Say something… 😀" maxlength="500"><button id="cs">Send</button></div></div><div id="t-queue" class="tab" hidden><div id="ql"></div><div class="row"><input id="qu" placeholder="Add video URL (https://…mp4)"><button id="qa">Add</button></div></div><div id="t-polls" class="tab" hidden><div id="pl"></div><div class="stack"><input id="pq" placeholder="Poll question"><textarea id="po" rows="3" placeholder="One option per line"></textarea><label class="poll-multi"><input type="checkbox" id="pmulti"> Allow voters to choose multiple options</label><button id="pc">Create poll</button></div></div><div id="t-people" class="tab" hidden><div id="people"></div><label class="mut">Playback control <select id="ctlmode"><option value="all">Everyone</option><option value="host">Host only</option></select></label></div></aside></div></main><div id="toast"></div>
<script src="config.js?v=6"></script><script src="sync.js?v=6"></script><script src="app.js?v=6"></script><script src="hotfix.js?v=6"></script><script src="fix2.js?v=1"></script></body></html>
